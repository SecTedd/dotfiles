os:
  editPreset: nvim-remote # opens files in the surrounding nvim, plain nvim otherwise
gui:
  nerdFontsVersion: "3"
  showCommandLog: false
  expandFocusedSidePanel: true
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    authorColors:
      "*": "#b4befe"
git:
  localBranchSortOrder: recency
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
    - type: rawGit # plain git diff as a fallback, switch with `|`
      name: default
