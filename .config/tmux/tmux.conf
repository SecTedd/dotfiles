# ── Terminal & colors ─────────────────────────────────────────
set -g default-terminal "tmux-256color"

# The lists below are appended to, so reset them to tmux's defaults first;
# otherwise every reload (prefix + r) adds the entries again
set -su terminal-features
set -gu update-environment

set -as terminal-features ",xterm-ghostty:RGB"      # true color (nvim themes)
set -as terminal-features ",xterm-ghostty:clipboard" # OSC 52 clipboard

# Pass modifier keys through (Shift+Enter, Ctrl+Shift+..., etc.)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Image previews in yazi (Ghostty's image protocol through tmux)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ── General ───────────────────────────────────────────────────
set -g escape-time 10          # no Esc delay in nvim
set -g focus-events on         # nvim autoread when switching panes
set -g history-limit 50000     # more scrollback
set -g set-clipboard on        # copy-mode yanks go to the macOS clipboard
set -g mouse on
set -g status-interval 5       # refresh status bar (Claude fleet) every 5s

set -g base-index 1            # windows start at 1
set -g pane-base-index 1       # panes start at 1
set -g renumber-windows on     # no gaps after closing a window

# Window names = current folder (instead of the running program)
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ── Prefix: <Ctrl-Space> ──────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind-key -N "Send the prefix key to the pane" C-Space send-prefix

# ── Splits & windows (open in current directory) ──────────────
# - and _ (shift) split below and above, < and > to the left and right (the
# two take over tmux's window and pane menus)
unbind %
unbind '"'
bind -N "New pane below (current folder)" - split-window -v -c "#{pane_current_path}"
bind -N "New pane above (current folder)" _ split-window -vb -c "#{pane_current_path}"
bind -N "New pane to the left (current folder)" < split-window -hb -c "#{pane_current_path}"
bind -N "New pane to the right (current folder)" > split-window -h -c "#{pane_current_path}"

bind -N "New window (current folder)" c new-window -c "#{pane_current_path}"

# Move the current window left/right (repeatable)
bind -r -N "Move window left (hold)" H swap-window -d -t -1
bind -r -N "Move window right (hold)" L swap-window -d -t +1

# ── Switch windows without the prefix ─────────────────────────
# Ghostty sends Ctrl-Tab, Ctrl-Shift-Tab and ⌘1-9 (as Ctrl-1-9) as extended keys
# (config.ghostty), which tmux reads with extended-keys on
bind -n -N "Last window (toggle back and forth)" C-Tab last-window
bind -n -N "Menu of the windows (1-9 picks)" C-BTab run-shell -b "bash ~/.config/tmux/window-menu.sh '#{client_name}'"
bind -n -N "Window 1 (⌘1)" C-1 select-window -t :1
bind -n -N "Window 2 (⌘2)" C-2 select-window -t :2
bind -n -N "Window 3 (⌘3)" C-3 select-window -t :3
bind -n -N "Window 4 (⌘4)" C-4 select-window -t :4
bind -n -N "Window 5 (⌘5)" C-5 select-window -t :5
bind -n -N "Window 6 (⌘6)" C-6 select-window -t :6
bind -n -N "Window 7 (⌘7)" C-7 select-window -t :7
bind -n -N "Window 8 (⌘8)" C-8 select-window -t :8
bind -n -N "Window 9 (⌘9)" C-9 select-window -t :9

# ── Reload config ─────────────────────────────────────────────
unbind r
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; run-shell -b 'open -g "hammerspoon://flash?text=tmux.conf%20reloaded"'

# ── Pane resizing (prefix + hjkl, repeatable) ─────────────────
bind -r -N "Resize pane down (hold)" j resize-pane -D 5
bind -r -N "Resize pane up (hold)" k resize-pane -U 5
bind -r -N "Resize pane right (hold)" l resize-pane -R 5
bind -r -N "Resize pane left (hold)" h resize-pane -L 5

# Pane maximize toggle
bind -N "Zoom pane (toggle)" m resize-pane -Z

# prefix + Ctrl-l clears the screen: bound at the end of the file, with the pane keys

# ── Type in all panes at once (prefix + a) ────────────────────
# While on: tab number + pane borders turn pink, dimming is off for the window.
# Feedback messages are Hammerspoon boxes (hammerspoon://flash, core/ui.lua),
# not the status bar.
bind -N "Type in all panes (toggle, pink = on)" a if -F '#{pane_synchronized}' {
  setw synchronize-panes off
  setw -u window-style
  run-shell -b 'open -g "hammerspoon://flash?text=Typing%20in%20all%20panes%3A%20OFF"'
} {
  setw synchronize-panes on
  setw window-style "fg=#cdd6f4"
  run-shell -b 'open -g "hammerspoon://flash?text=Typing%20in%20all%20panes%3A%20ON"'
}

# ── Dim inactive panes ────────────────────────────────────────
set -g window-style "fg=#7f849c"         # catppuccin overlay1
set -g window-active-style "fg=#cdd6f4"  # catppuccin text

# A Claude prompt buffer's pane and its Claude pane light up together: nvim
# (lua/config/claude_prompt.lua) names them each other's @claude_peer while the
# buffer is current, and whichever of the two is active gives the other the
# active look (focus-events is on, so the hooks fire on every switch)
set-hook -g pane-focus-in {
  if -F '#{@claude_peer}' { run-shell -C "set -p -t '#{@claude_peer}' window-style '#{window-active-style}'" }
}
set-hook -g pane-focus-out {
  if -F '#{@claude_peer}' { run-shell -C "set -pu -t '#{@claude_peer}' window-style" }
}

# ── Copy mode (vi keys) ───────────────────────────────────────
set-window-option -g mode-keys vi

bind -N "Copy mode (v select, y copy)" v copy-mode

bind-key -T copy-mode-vi -N "Start selecting" v send -X begin-selection
bind-key -T copy-mode-vi -N "Copy selection, leave copy mode" y send -X copy-selection-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# ── Claude Code integration (scripts in ~/.claude/) ───────────
# Adapted from https://github.com/scorphus/tmux-claude-integration
# (Copyright (c) 2026, Pablo Aguiar, BSD 3-Clause, see LICENSES/ in the dotfiles repo)
# prefix + A: jump to the window that rang the bell, and to the Claude pane that
# rang it (claude-announce.sh stores it as @claude_alert_pane on the window)
bind -N "Jump to the pane where Claude rang" A next-window -a \; if -F "#{@claude_alert_pane}" { run-shell -C "set -wu @claude_alert_pane ; select-pane -t \"#{@claude_alert_pane}\"" }
bind -N "Menu of running Claude sessions" BSpace run-shell -b "bash ~/.claude/claude-menu.sh '#{client_name}'"
# A click on a dot of the Claude fleet in the status bar jumps to that session:
# claude-fleet.sh marks every dot with its pane number as a mouse range, which
# the click reports. Anywhere else on the bar a click picks the window, as tmux does
bind -n -N "Click a fleet dot: jump to that Claude" MouseDown1Status if -F '#{m/r:^[0-9]+$,#{mouse_status_range}}' { run-shell -C "switch-client -t '%#{mouse_status_range}'" } { select-window -t = }
bind -N "Mute / unmute Claude sounds" M run-shell -b 'open -g "hammerspoon://claude-mute-toggle"'

# ── Hammerspoon toggles (menu bar icon = silent click, these keys = box) ──
bind -N "Caffeine: keep the display awake" C run-shell -b 'open -g "hammerspoon://caffeine-toggle"'

# ── Read-only Claude (prefix + R) ─────────────────────────────
# The Claude in this pane may only read: ~/.claude/claude-readonly.sh (a Claude
# Code hook) checks the pane option, the status line shows a red lock
bind -N "Read-only Claude in this pane (toggle)" R if -F '#{@claude_readonly}' {
  set -pu @claude_readonly
  run-shell -b 'open -g "hammerspoon://flash?text=%F3%B0%8C%BF%20Read-only%20Claude%3A%20OFF"'
} {
  set -p @claude_readonly 1
  run-shell -b 'open -g "hammerspoon://flash?text=%F3%B0%8C%BE%20Read-only%20Claude%3A%20ON"'
}

# ── Plugins ───────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2' # See https://github.com/catppuccin/tmux/tags

# ── Theme (catppuccin options must be set before tpm runs) ────
set -g @catppuccin_flavor "mocha"                   # matches Ghostty theme
set -g @catppuccin_status_background "default"      # solid bar

# Tabs the way Pablo's bar draws them (see README): one block per tab holding the
# number, a space and the name, a cap on each side. Both caps are Nerd Font
# U+E0C6, a block dissolving to the right, drawn in the left part's color over
# the right part's: the left cap in the bar's color over the block's, so the tab
# emerges from the bar, the right cap the other way round. Tabs touch, so a fade
# out meets the next fade in. The caps use the theme's trick for a bar without a
# color of its own (reverse). The number's color is the window's state: red =
# rang the bell (Claude done/waiting), pink = typing in all panes, mauve = the
# current window. A zoomed pane dots the name
set -g @catppuccin_window_status_style "custom"
%hidden FADE="\uE0C6"
%hidden TAB_FADE_OUT="#[fg=#{@_ctp_status_bg},reverse]$FADE#[none]"
# The number's block is the name's (the theme's text colors), its state colors go
# into the cap's closing style. Options, not strings, so the window flags are read
# when a tab is drawn, not once when the theme builds the format
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_surface_1}"
set -g @tab_number_fg "#{?window_bell_flag,#{@thm_red},#{?pane_synchronized,#{@thm_pink},#{@thm_overlay_2}}}"
set -g @tab_current_number_fg "#{?pane_synchronized,#{@thm_pink},#{@thm_mauve}}"
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@_ctp_status_bg},reverse]$FADE#[none,fg=#{@tab_number_fg},bg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "$TAB_FADE_OUT"
# The current window's separators too: the theme copies them from the ones above
# only when they are unset, and a reload (prefix + r) finds the old ones set
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@_ctp_status_bg},reverse]$FADE#[none,fg=#{@tab_current_number_fg},bg=#{@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "$TAB_FADE_OUT"
%hidden TAB_NAME='#{?window_zoomed_flag,#[dotted-underscore]#W#[nodotted-underscore],#W}'
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_text "$TAB_NAME"
set -g @catppuccin_window_current_text "$TAB_NAME"

# Right side: session and clock in one block like a tab, each icon in its module's
# color on the block, a space, its text; the same fade in from the bar and out
# (the closing fade is added with status-right below). The theme puts the icon's
# background color in fg before the fade, so reverse paints the fade in whatever
# color came before, over the block's; between the two modules that is block on
# block, a plain gap
set -g @catppuccin_status_left_separator "#[reverse]$FADE#[none]"
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_session_icon_bg "#{@thm_surface_0}"
set -g @catppuccin_status_session_icon_fg "#{?client_prefix,#{@thm_red},#{@thm_green}}" # the theme's session colors
set -g @catppuccin_status_date_time_icon_bg "#{@thm_surface_0}"
set -g @catppuccin_status_date_time_icon_fg "#{@catppuccin_date_time_color}"
set -g @catppuccin_session_text "#S"
set -g @catppuccin_date_time_text "%H:%M"          # time only
# The clock is Font Awesome's U+F017: tmux decodes \uXXXX only, the theme's
# calendar clock is a 4-byte glyph
set -g @catppuccin_session_icon "\uE795"
set -g @catppuccin_date_time_icon "\uF017"

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 160

# Plugins live in ~/.tmux/plugins/ (downloaded data, not part of the dotfiles).
# Without this, tpm looks in ~/.config/tmux/plugins/ because tmux.conf is there.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"

# tmux 3.8 underlines the current window tab by default; catppuccin's rounded
# tabs (v2.3.2) don't expect that, the line shows under the round edges
set -g window-status-current-style default
set -g window-status-separator "" # tabs touch

# tmux 3.8 has its own built-in colors (themedarkgrey, ...) for everything
# catppuccin doesn't style: menus, search matches, tree mode, scrollbars, ...
# "terminal" maps them to the terminal's ANSI colors = Ghostty's Catppuccin palette
set -g theme terminal

# Pane titles on the borders (Claude sets its title; shells show the program)
set -g pane-border-status top
set -g pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-format " #{pane_index} #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} "
set -g pane-border-style "#{?pane_synchronized,fg=#{@thm_pink},fg=#{@thm_overlay_0}}"
set -g pane-active-border-style "#{?pane_synchronized,fg=#{@thm_pink},fg=#{@thm_lavender}}"

set -g status-left ""

# ── Load the plugins, then what builds on catppuccin ──────────
# Without the plugins (a fresh Mac before setup.sh) tmux still works, just
# without the theme, and the status bar says so.
# Inside the block: the status bar (fleet capsules, session, time) and the menus
# (e.g. the Claude session menu), which since tmux 3.8 have their own grey
# background: Catppuccin background, rounded lavender border (like the active
# pane border), mauve selection (like the current tab).
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' {
  run '~/.tmux/plugins/tpm/tpm'
  set -g status-right "#(bash ~/.claude/claude-fleet.sh '#{client_width}')"
  set -ag status-right "#{E:@catppuccin_status_session}"
  set -ag status-right "#{E:@catppuccin_status_date_time}"
  set -ag status-right "#[fg=#{@thm_surface_0},bg=default]\uE0C6" # the fade that closes the capsule
  set -gF menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
  set -gF menu-border-style "bg=#{@thm_bg},fg=#{@thm_lavender}"
  set -gF menu-selected-style "bg=#{@thm_mauve},fg=#{@thm_crust},bold"
  set -g menu-border-lines rounded
} {
  set -g status-right "#[fg=yellow] tmux plugins missing: run ~/dotfiles/setup.sh "
}

# ── Panes and nvim splits: Ctrl-hjkl, Ctrl-\ ─────────────────
# In a pane running vim the key goes to vim (nvim's lua/config/tmux_navigate.lua
# moves between splits and calls tmux at an edge), elsewhere tmux moves. The
# test is a format on the pane's program, so no shell runs per key press.
# Inspired by christoomey/vim-tmux-navigator (MIT).
%hidden IS_VIM='#{m/r:^(g?(view|l?n?vim?x?)(diff)?|fzf)$,#{pane_current_command}}'
bind -n -N "Pane / nvim split to the left" C-h if -F "$IS_VIM" 'send-keys C-h' 'select-pane -L'
bind -n -N "Pane / nvim split below" C-j if -F "$IS_VIM" 'send-keys C-j' 'select-pane -D'
bind -n -N "Pane / nvim split above" C-k if -F "$IS_VIM" 'send-keys C-k' 'select-pane -U'
bind -n -N "Pane / nvim split to the right" C-l if -F "$IS_VIM" 'send-keys C-l' 'select-pane -R'
bind -n -N "Previous pane / split" 'C-\' if -F "$IS_VIM" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi -N "Pane to the left" C-h select-pane -L
bind -T copy-mode-vi -N "Pane below" C-j select-pane -D
bind -T copy-mode-vi -N "Pane above" C-k select-pane -U
bind -T copy-mode-vi -N "Pane to the right" C-l select-pane -R
bind -T copy-mode-vi -N "Previous pane" 'C-\' select-pane -l
bind -N "Clear screen (⌃L alone moves between panes)" C-l send-keys 'C-l'
